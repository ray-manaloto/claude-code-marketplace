# Use ./dev/mise. The root mise.toml remains the Linux OCI definition.
# Auto-install stays disabled in dev/mise; these exact tools must already exist.
min_version = "2026.10.8"

[tools]
python = "3.15.0"
uv = "0.13.0"

[settings]
experimental = true

[deps.uv]
auto = false
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv"]
run = "uv sync --locked --offline --no-python-downloads"

[tasks."tools:prepare"]
description = "Install only the exact development tools from mise.dev.lock"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py tools-prepare'

[tasks."deps:lock"]
description = "Explicitly refresh the development tool and Python dependency locks"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py deps-lock'

[tasks."deps:sync"]
description = "Explicitly sync project Python dependencies from the reviewed lock"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py deps-sync'

[tasks."deps:check"]
description = "Refuse a missing, drifted or unsynchronized development environment"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py deps-check'

[tasks."test:bootstrap"]
description = "Exercise public bootstrap refusal and unrelated-cwd controls in scratch"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py test'

[tasks."research:one-page"]
description = "Capture one bounded public GitHubKit code-search page"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<mode>" choices "offline" "live" help="Offline SDK fixture or one live page"; arg "[fixture]" default="dev/fixtures/github-code-search-empty.json" help="Project-local raw fixture for offline mode"'
run = 'uv run --no-sync --offline python -B dev/github_search_one_page.py "${usage_mode?}" --fixture "${usage_fixture?}"'

[tasks."test:one-page"]
description = "Run offline GitHubKit one-page request and status controls"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_github_search_one_page.py -v'

[tasks."research:catalog"]
description = "Validate or record one saved GitHubKit query with immutable evidence"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<mode>" choices "validate" "offline" "live"; arg "<id>"; arg "[fixture]" default="dev/fixtures/github-code-search-empty.json"'
run = 'uv run --no-sync --offline python -B dev/search_catalog.py "${usage_mode?}" --id "${usage_id?}" --fixture "${usage_fixture?}"'

[tasks."research:quarantine"]
description = "Append a hash-bound exclusion for one retained saved-search run"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<run_id>"; arg "<reason>"'
run = 'uv run --no-sync --offline python -B dev/search_catalog.py quarantine --run-id "${usage_run_id?}" --reason "${usage_reason?}"'

[tasks."research:collect"]
description = "Collect bounded GitHubKit pages with per-attempt HTTP evidence"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<mode>" choices "offline" "live"; arg "<id>"; arg "[fixture]" default="dev/fixtures/github-code-search-empty.json"'
run = 'uv run --no-sync --offline python -B dev/collect_saved_search.py "${usage_mode?}" --id "${usage_id?}" --fixture "${usage_fixture?}"'

[tasks."research:collect-all"]
description = "Rerun every saved query with per-query serial comparison receipts"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<mode>" choices "offline" "live"; arg "[fixture_dir]" default="dev/fixtures/saved-searches"'
run = 'uv run --no-sync --offline python -B dev/collect_saved_search.py "${usage_mode?}" --all --fixture-dir "${usage_fixture_dir?}"'

[tasks."test:collect"]
description = "Exercise bounded pagination, retry and attempt preservation offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_collect_saved_search.py -v'

[tasks."test:control"]
description = "Exercise same-budget known-result controls and completeness verdicts offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_control_saved_search.py -v'

[tasks."test:compare"]
description = "Exercise compatible immutable baselines and pure comparisons offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_search_compare.py -v'

[tasks."test:publish"]
description = "Exercise public rerun and concurrent comparison receipts offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_search_publish.py -v'

[tasks."test:catalog"]
description = "Exercise catalog validation, immutable records and quarantine offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_search_catalog.py -v'

[tasks."check:research"]
description = "Run the portable bootstrap and offline research regression checks"
dir = "{{config_root}}"
depends = ["test:bootstrap", "test:one-page", "test:catalog", "test:collect", "test:control", "test:compare", "test:publish"]
run = '"${MARKETPLACE_PYTHON:-python3}" dev/check.py --baseline'

[tasks.check]
description = "Parse project manifests and scripts without installation or network access"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" dev/check.py'

[tasks."check:acceptance-baseline"]
description = "Also verify the 19 original files against the onboarding baseline"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" dev/check.py --baseline'

[tasks."test:delivery"]
description = "Exercise A09 exact-input staging, scan and publication refusals in scratch repositories"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B -m unittest discover -s dev -p test_git_delivery.py -v'

[tasks."test:issue-amend"]
description = "Exercise A07a single-issue amendment and ambiguous-send controls offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_issue_amend.py -v'

[tasks."issue:preview"]
description = "Record one issue preimage and exact proposed body and labels"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<issue>"; arg "<body_file>"; arg "<labels_file>"; arg "<intent_file>"'
run = 'uv run --no-sync --offline python -B dev/issue_amend.py preview --issue "${usage_issue?}" --body-file "${usage_body_file?}" --labels-file "${usage_labels_file?}" --intent-file "${usage_intent_file?}"'

[tasks."issue:apply"]
description = "Attempt one exact issue body/label PATCH from a SHA-bound intent"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_amend.py apply --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."issue:verify"]
description = "Read back an attempted issue amendment without another write"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_amend.py verify --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."delivery:inspect-hooks"]
description = "Read the active Git file and config hook digest for an exact A09 intent"
dir = "{{config_root}}"
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/git_delivery.py inspect-hooks --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."delivery:stage-blob"]
description = "Stage one reviewed A09 mixed-file blob from a SHA-bound intent"
dir = "{{config_root}}"
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/git_delivery.py stage-blob --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."delivery:prepare"]
description = "Stage only reviewed A09 paths and emit the exact index tree"
dir = "{{config_root}}"
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/git_delivery.py prepare --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."delivery:publish"]
description = "Run reviewed A09 checks and scans, then publish the exact branch commit"
dir = "{{config_root}}"
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/git_delivery.py publish --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'
