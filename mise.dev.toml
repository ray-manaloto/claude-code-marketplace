# Use ./dev/mise. The root mise.toml remains the Linux OCI definition.
# Auto-install stays disabled in dev/mise; these exact tools must already exist.
min_version = "2026.10.8"

[tools]
python = "3.15.0"
uv = "0.13.0"

[settings]
experimental = true

[deps.uv]
auto = false
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv"]
run = "uv sync --locked --offline --no-python-downloads"

[tasks."tools:prepare"]
description = "Install only the exact development tools from mise.dev.lock"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py tools-prepare'

[tasks."deps:lock"]
description = "Explicitly refresh the development tool and Python dependency locks"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py deps-lock'

[tasks."deps:sync"]
description = "Explicitly sync project Python dependencies from the reviewed lock"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py deps-sync'

[tasks."deps:check"]
description = "Refuse a missing, drifted or unsynchronized development environment"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py deps-check'

[tasks."test:bootstrap"]
description = "Exercise public bootstrap refusal and unrelated-cwd controls in scratch"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/bootstrap.py test'

[tasks."research:one-page"]
description = "Capture one bounded public GitHubKit code-search page"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<mode>" choices "offline" "live" help="Offline SDK fixture or one live page"; arg "[fixture]" default="dev/fixtures/github-code-search-empty.json" help="Project-local raw fixture for offline mode"'
run = 'uv run --no-sync --offline python -B dev/github_search_one_page.py "${usage_mode?}" --fixture "${usage_fixture?}"'

[tasks."test:one-page"]
description = "Run offline GitHubKit one-page request and status controls"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_github_search_one_page.py -v'

[tasks."research:catalog"]
description = "Validate or record one saved GitHubKit query with immutable evidence"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<mode>" choices "validate" "offline" "live"; arg "<id>"; arg "[fixture]" default="dev/fixtures/github-code-search-empty.json"'
run = 'uv run --no-sync --offline python -B dev/search_catalog.py "${usage_mode?}" --id "${usage_id?}" --fixture "${usage_fixture?}"'

[tasks."research:quarantine"]
description = "Append a hash-bound exclusion for one retained saved-search run"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<run_id>"; arg "<reason>"'
run = 'uv run --no-sync --offline python -B dev/search_catalog.py quarantine --run-id "${usage_run_id?}" --reason "${usage_reason?}"'

[tasks."research:collect"]
description = "Collect bounded GitHubKit pages with per-attempt HTTP evidence"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<mode>" choices "offline" "live"; arg "<id>"; arg "[fixture]" default="dev/fixtures/github-code-search-empty.json"'
run = 'uv run --no-sync --offline python -B dev/collect_saved_search.py "${usage_mode?}" --id "${usage_id?}" --fixture "${usage_fixture?}"'

[tasks."research:collect-all"]
description = "Rerun every saved query with per-query serial comparison receipts"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<mode>" choices "offline" "live"; arg "[fixture_dir]" default="dev/fixtures/saved-searches"'
run = 'uv run --no-sync --offline python -B dev/collect_saved_search.py "${usage_mode?}" --all --fixture-dir "${usage_fixture_dir?}"'

[tasks."test:collect"]
description = "Exercise bounded pagination, retry and attempt preservation offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_collect_saved_search.py -v'

[tasks."test:control"]
description = "Exercise same-budget known-result controls and completeness verdicts offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_control_saved_search.py -v'

[tasks."test:compare"]
description = "Exercise compatible immutable baselines and pure comparisons offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_search_compare.py -v'

[tasks."test:publish"]
description = "Exercise public rerun and concurrent comparison receipts offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_search_publish.py -v'

[tasks."test:catalog"]
description = "Exercise catalog validation, immutable records and quarantine offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_search_catalog.py -v'

[tasks."check:research"]
description = "Run the portable bootstrap and offline research regression checks"
dir = "{{config_root}}"
depends = ["test:bootstrap", "test:one-page", "test:catalog", "test:collect", "test:control", "test:compare", "test:publish", "test:examples", "test:issue-create", "test:issue-amend", "test:issue-new-edges"]
run = '"${MARKETPLACE_PYTHON:-python3}" dev/check.py --baseline'

[tasks.check]
description = "Parse project manifests and scripts without installation or network access"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" dev/check.py'

[tasks."check:acceptance-baseline"]
description = "Also verify the 19 original files against the onboarding baseline"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" dev/check.py --baseline'

[tasks."retro:gate"]
description = "Refuse integration or publication of a unit without a complete retrospective record"
dir = "{{config_root}}"
usage = 'arg "<unit>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -I dev/retro_gate.py --unit "${usage_unit?}"'

[tasks."test:delivery"]
description = "Exercise A09 exact-input staging, scan and publication refusals in scratch repositories"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B -m unittest discover -s dev -p test_git_delivery.py -v'

[tasks."test:issue-amend"]
description = "Exercise issue amendments, accepted completion and ambiguous sends offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_issue_amend.py -v'

[tasks."issue:preview"]
description = "Record one issue preimage and exact proposed body and labels"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<issue>"; arg "<body_file>"; arg "<labels_file>"; arg "<intent_file>"'
run = 'uv run --no-sync --offline python -B dev/issue_amend.py preview --issue "${usage_issue?}" --body-file "${usage_body_file?}" --labels-file "${usage_labels_file?}" --intent-file "${usage_intent_file?}"'

[tasks."issue:completion-preview"]
description = "Bind accepted completion evidence to one exact open issue"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<issue>"; arg "<evidence_file>"; arg "<intent_file>"'
run = 'uv run --no-sync --offline python -B dev/issue_amend.py preview-completion --issue "${usage_issue?}" --evidence-file "${usage_evidence_file?}" --intent-file "${usage_intent_file?}"'

[tasks."issue:apply"]
description = "Attempt one SHA-bound issue amendment or completed-state PATCH"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_amend.py apply --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."issue:verify"]
description = "Read back an attempted issue change without another write"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_amend.py verify --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."delivery:inspect-hooks"]
description = "Read the active Git file and config hook digest for an exact A09 intent"
dir = "{{config_root}}"
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/git_delivery.py inspect-hooks --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."delivery:stage-blob"]
description = "Stage one reviewed A09 mixed-file blob from a SHA-bound intent"
dir = "{{config_root}}"
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/git_delivery.py stage-blob --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."delivery:prepare"]
description = "Stage only reviewed A09 paths and emit the exact index tree"
dir = "{{config_root}}"
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/git_delivery.py prepare --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'

[tasks."delivery:publish"]
description = "Run reviewed A09 checks and scans, then publish the exact branch commit"
dir = "{{config_root}}"
usage = 'arg "<intent_file>"; arg "<sha256>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/git_delivery.py publish --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_sha256?}"'
[tasks."checkout:plan"]
description = "Inventory source and old worktree for a dry-run A10 transfer plan"
dir = "{{config_root}}"
usage = 'arg "<published_commit>"; arg "<source_head>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/checkout_transfer.py plan --commit "${usage_published_commit?}" --source-head "${usage_source_head?}"'

[tasks."checkout:plan-approved"]
description = "Replan with reviewed handoff hashes and an explicit source-preparation decision"
dir = "{{config_root}}"
usage = 'arg "<published_commit>"; arg "<source_head>"; arg "<approvals_file>"; arg "<preparation_decision>" choices "hold" "admit-source-preparation"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/checkout_transfer.py plan --commit "${usage_published_commit?}" --source-head "${usage_source_head?}" --approvals-file "${usage_approvals_file?}" --preparation-decision "${usage_preparation_decision?}"'

[tasks."test:checkout"]
description = "Exercise A10 dry-run, approval, collision and drift refusals in scratch"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B -m unittest discover -s dev -p test_checkout_transfer.py -v'

[tasks."checkout:apply-prepare"]
description = "Revalidate one SHA-bound A10 plan and freeze an A11a intent without switching checkouts"
dir = "{{config_root}}"
usage = 'arg "<plan_file>"; arg "<sha256>"; arg "<intent_file>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/checkout_apply.py prepare --plan-file "${usage_plan_file?}" --plan-sha256 "${usage_sha256?}" --intent-file "${usage_intent_file?}"'

[tasks."test:checkout-apply"]
description = "Exercise A11a drift, collision, remote, retention and interruption refusals in scratch"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B -m unittest discover -s dev -p test_checkout_apply.py -v'
[tasks."checkout:switch-guarded"]
description = "Revalidate SHA-bound A10/A11a preimages and journal a guarded source switch"
dir = "{{config_root}}"
usage = 'arg "<plan_file>"; arg "<plan_sha256>"; arg "<intent_file>"; arg "<intent_sha256>"; arg "<journal_dir>"'
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/checkout_switch.py switch --plan-file "${usage_plan_file?}" --plan-sha256 "${usage_plan_sha256?}" --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_intent_sha256?}" --journal-dir "${usage_journal_dir?}"'

[tasks."test:checkout-switch"]
description = "Exercise guarded switch, drift and inspected recovery on scratch Git worktrees"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B -m unittest discover -s dev -p test_checkout_switch.py -v'

[tasks."test:issue-create"]
description = "Exercise approved issue creation, legacy A-series and recovery offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_issue_create.py -v'

[tasks."issue:create-preview"]
description = "Freeze one approved issue and fresh hierarchy/repository preimages"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'flag "--manifest-file <path>" default="dev/issue-tickets.json" help="Approved versioned manifest"; arg "<local_id>"; arg "<journal_dir>"'
run = 'uv run --no-sync --offline python -B dev/issue_create.py preview --manifest-file "${usage_manifest_file?}" --local-id "${usage_local_id?}" --journal-dir "${usage_journal_dir?}"'

[tasks."issue:create-apply"]
description = "Attempt one SHA-bound issue POST; unresolved attempts are verify-only"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'flag "--manifest-file <path>" default="dev/issue-tickets.json" help="Approved versioned manifest"; arg "<local_id>"; arg "<journal_dir>"; arg "<sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_create.py apply --manifest-file "${usage_manifest_file?}" --local-id "${usage_local_id?}" --journal-dir "${usage_journal_dir?}" --intent-sha256 "${usage_sha256?}"'

[tasks."issue:create-verify"]
description = "Resolve an attempted issue from complete lists without another POST"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'flag "--manifest-file <path>" default="dev/issue-tickets.json" help="Approved versioned manifest"; arg "<local_id>"; arg "<journal_dir>"; arg "<sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_create.py verify --manifest-file "${usage_manifest_file?}" --local-id "${usage_local_id?}" --journal-dir "${usage_journal_dir?}" --intent-sha256 "${usage_sha256?}"'

[tasks."test:issue-new-edges"]
description = "Exercise approved blocker graphs, legacy A-series and recovery offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_issue_edges.py -v'

[tasks."issue:new-edge-preview"]
description = "Record one selected new-ticket blocker-edge intent without mutation"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'flag "--manifest-file <path>" default="dev/issue-tickets.json" help="Approved versioned manifest"; arg "<graph_file>"; arg "<graph_sha256>"; arg "<journal_dir>"; arg "<target>"; arg "<blocker>"'
run = 'uv run --no-sync --offline python -B dev/issue_edges.py preview --manifest-file "${usage_manifest_file?}" --graph-file "${usage_graph_file?}" --graph-sha256 "${usage_graph_sha256?}" --journal-dir "${usage_journal_dir?}" --target "${usage_target?}" --blocker "${usage_blocker?}"'

[tasks."issue:new-edge-apply"]
description = "Attempt one SHA-bound approved blocker-edge mutation"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'flag "--manifest-file <path>" default="dev/issue-tickets.json" help="Approved versioned manifest"; arg "<graph_file>"; arg "<graph_sha256>"; arg "<intent_file>"; arg "<intent_sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_edges.py apply --manifest-file "${usage_manifest_file?}" --graph-file "${usage_graph_file?}" --graph-sha256 "${usage_graph_sha256?}" --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_intent_sha256?}"'

[tasks."issue:new-edge-verify"]
description = "Read back an attempted blocker edge without another send"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'flag "--manifest-file <path>" default="dev/issue-tickets.json" help="Approved versioned manifest"; arg "<graph_file>"; arg "<graph_sha256>"; arg "<intent_file>"; arg "<intent_sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_edges.py verify --manifest-file "${usage_manifest_file?}" --graph-file "${usage_graph_file?}" --graph-sha256 "${usage_graph_sha256?}" --intent-file "${usage_intent_file?}" --intent-sha256 "${usage_intent_sha256?}"'

[tasks."issue:new-edges-audit"]
description = "Audit the complete approved blocker graph across open and closed issues"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'flag "--manifest-file <path>" default="dev/issue-tickets.json" help="Approved versioned manifest"; arg "<graph_file>"; arg "<graph_sha256>"'
run = 'uv run --no-sync --offline python -B dev/issue_edges.py audit --manifest-file "${usage_manifest_file?}" --graph-file "${usage_graph_file?}" --graph-sha256 "${usage_graph_sha256?}"'

[tasks."check:research-feedback"]
description = "Run offline research coverage regression controls"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B -m unittest discover -s dev -p test_research_feedback.py -v'

[tasks."research:replay-feedback"]
description = "Replay explicit native observations and feedback without provider calls"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B dev/research_feedback.py'


[tasks."research:examples"]
description = "Fetch one selected public Git blob from a verified saved-search run"
dir = "{{config_root}}"
depends = ["deps:check"]
usage = 'arg "<run_id>"; arg "<sha>"'
run = 'uv run --no-sync --offline python -B dev/codex_examples.py "${usage_run_id?}" --sha "${usage_sha?}"'

[tasks."test:examples"]
description = "Exercise SHA-bound public blob retrieval offline"
dir = "{{config_root}}"
depends = ["deps:check"]
run = 'uv run --no-sync --offline python -B -m unittest discover -s dev -p test_codex_examples.py -v'
[tasks."check:research-outcomes"]
description = "Run shared offline receipt and acceptance-state controls"
dir = "{{config_root}}"
run = '"${MARKETPLACE_PYTHON:-python3}" -B -m unittest discover -s dev -p test_research_outcomes.py -v'
