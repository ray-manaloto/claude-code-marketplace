name: development checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check manifests, scripts and research feedback
        # Same entry point as the development mise check; no runtime installation.
        run: python3 -B dev/check.py
