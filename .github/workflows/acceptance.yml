name: acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v4.3.0
        with:
          experimental: true

      - name: build the container image
        # docs state root is required for apk layers; measured 2026-08-28 that
        # apt layers ALSO need it here — dpkg maintainer scripts write to
        # host paths (/var/cache/debconf, /var/lib/update-notifier) despite
        # the --root rootfs override, and fail EACCES as the unprivileged
        # runner user. No OAuth token in this step's env — it's job-scoped
        # away and only exported on the acceptance step below.
        run: sudo -E "$(command -v mise)" oci build

      - name: smoke test — claude --version inside the image
        run: |
          set -o pipefail
          mise oci run --engine docker --image-dir mise-oci -- claude --version | tee /tmp/smoke.out
          # Read the expected version from mise.toml's own pin rather than a
          # hardcoded literal, so this check can't silently drift out of sync
          # with the pin the way it did going from 2.1.250 -> 2.1.251.
          pinned="$(grep -oP '"npm:@anthropic-ai/claude-code"\s*=\s*\{[^}]*version\s*=\s*"\K[^"]+' mise.toml)"
          grep -F "$pinned" /tmp/smoke.out

      - name: acceptance — one container, full sequence
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mise oci run --engine docker --image-dir mise-oci \
            --volume "$PWD:/work" \
            -e CLAUDE_CODE_PLUGIN_PREFER_HTTPS=1 \
            -e GH_TOKEN \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -- sh /work/ci/acceptance.sh >acceptance.log 2>&1
          rc=$?
          cat acceptance.log
          if grep -qF 'SKIPPED: no CLAUDE_CODE_OAUTH_TOKEN' acceptance.log; then
            echo '⚠ agent step SKIPPED (no token)' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: fail loud if the agent step skipped on a same-repo PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && env.CLAUDE_CODE_OAUTH_TOKEN == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN is empty on a same-repo PR — that's a misconfiguration, not an expected skip." >&2
          exit 1

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: acceptance-log
          path: acceptance.log
