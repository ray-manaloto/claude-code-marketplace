name: acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v4.3.0
        with:
          experimental: true

      - name: build the container image
        run: mise oci build

      - name: smoke test — claude --version inside the image
        run: |
          mise oci run --engine docker --image-dir mise-oci -- claude --version | tee /tmp/smoke.out
          grep -F '2.1.250' /tmp/smoke.out

      - name: acceptance — one container, full sequence
        run: |
          set -o pipefail
          mise oci run --engine docker --image-dir mise-oci \
            --volume "$PWD:/work" \
            -e CLAUDE_CODE_PLUGIN_PREFER_HTTPS=1 \
            -e GH_TOKEN="${{ github.token }}" \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -- sh /work/ci/acceptance.sh 2>&1 | tee acceptance.log
          exit "${PIPESTATUS[0]}"

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: acceptance-log
          path: acceptance.log
