# Set the prefix only from task 05's qualified managed-install receipt.
include = ["cpp-foundation/common.toml"]

[env]
MARKETPLACE_CPP_LANE = "gcc16"
CC = """\
{% set prefix = env.MARKETPLACE_GCC16_PREFIX | default(value='') %}\
{% set clean = prefix | trim %}\
{% if prefix != clean or not (prefix is starting_with(pat='/')) or prefix == '/' %}\
{{ throw(message='Set MARKETPLACE_GCC16_PREFIX to the qualified absolute managed prefix from task 05.') }}\
{% endif %}\
{% for part in prefix | split(pat='/') %}\
{% if not loop.first and (part == '' or part == '.' or part == '..') %}\
{{ throw(message='Use a normalized managed prefix without empty or dot path components.') }}\
{% endif %}{% endfor %}{{ prefix }}/bin/gcc-16"""
CXX = """\
{% set prefix = env.MARKETPLACE_GCC16_PREFIX | default(value='') %}\
{% set clean = prefix | trim %}\
{% if prefix != clean or not (prefix is starting_with(pat='/')) or prefix == '/' %}\
{{ throw(message='Set MARKETPLACE_GCC16_PREFIX to the qualified absolute managed prefix from task 05.') }}\
{% endif %}\
{% for part in prefix | split(pat='/') %}\
{% if not loop.first and (part == '' or part == '.' or part == '..') %}\
{{ throw(message='Use a normalized managed prefix without empty or dot path components.') }}\
{% endif %}{% endfor %}{{ prefix }}/bin/g++-16"""
